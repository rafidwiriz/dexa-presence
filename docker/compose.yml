services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dexa
      POSTGRES_PASSWORD: dexa
      POSTGRES_DB: dexa_presence
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dexa -d dexa_presence"], interval: 5s, retries: 10 }
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
volumes:
  postgres_data:
